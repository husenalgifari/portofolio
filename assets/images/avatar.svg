<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#151b2e"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdfba"/>
      <stop offset="100%" stop-color="#e5b88f"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2640"/>
      <stop offset="100%" stop-color="#111625"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="30" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Circles -->
  <circle cx="250" cy="220" r="170" fill="none" stroke="url(#primaryGlow)" stroke-width="3" opacity="0.4" filter="url(#neonBlur)"/>
  <circle cx="250" cy="220" r="150" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Code Matrix Grid Dots in Background -->
  <g fill="#334155" opacity="0.3">
    <circle cx="70" cy="70" r="3"/><circle cx="100" cy="70" r="3"/><circle cx="130" cy="70" r="3"/>
    <circle cx="70" cy="100" r="3"/><circle cx="100" cy="100" r="3"/><circle cx="130" cy="100" r="3"/>
    <circle cx="370" cy="70" r="3"/><circle cx="400" cy="70" r="3"/><circle cx="430" cy="70" r="3"/>
    <circle cx="370" cy="100" r="3"/><circle cx="400" cy="100" r="3"/><circle cx="430" cy="100" r="3"/>
  </g>

  <!-- Developer Silhouette / Character -->
  <!-- Hoodie / Shoulders -->
  <path d="M120 480 C120 380 170 330 250 330 C330 330 380 380 380 480 Z" fill="url(#hoodieGrad)"/>
  <path d="M210 330 L250 390 L290 330 Z" fill="#2d3748" opacity="0.6"/>
  <path d="M250 390 L250 480" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Neck -->
  <rect x="225" y="270" width="50" height="60" rx="10" fill="#e5b88f"/>

  <!-- Face -->
  <ellipse cx="250" cy="220" rx="65" ry="75" fill="url(#skinGrad)"/>

  <!-- Stylish Modern Hair -->
  <path d="M180 200 C175 140 210 110 260 110 C310 110 330 140 325 180 C320 185 300 170 270 175 C240 180 210 170 195 195 Z" fill="#1e1b2e"/>
  <!-- Hair volume / texture -->
  <path d="M185 170 Q240 120 280 130 Q325 140 320 180" fill="none" stroke="#2e2a44" stroke-width="8" stroke-linecap="round"/>

  <!-- Glasses / Smart Specs -->
  <rect x="200" y="205" width="40" height="24" rx="6" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <rect x="260" y="205" width="40" height="24" rx="6" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <line x1="240" y1="217" x2="260" y2="217" stroke="#06b6d4" stroke-width="3"/>
  <line x1="185" y1="215" x2="200" y2="215" stroke="#06b6d4" stroke-width="3"/>
  <line x1="300" y1="215" x2="315" y2="215" stroke="#06b6d4" stroke-width="3"/>
  
  <!-- Eyes behind glasses -->
  <circle cx="220" cy="217" r="4" fill="#0f172a"/>
  <circle cx="280" cy="217" r="4" fill="#0f172a"/>

  <!-- Confident Smile -->
  <path d="M232 255 Q250 270 268 255" fill="none" stroke="#8c5836" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Floating Holographic Badge <CODE/> -->
  <g transform="translate(60, 340)">
    <rect width="105" height="38" rx="10" fill="#0e1526" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
    <text x="14" y="24" fill="#8b5cf6" font-family="monospace" font-size="14" font-weight="bold">&lt;/CODE&gt;</text>
  </g>

  <!-- Floating Holographic Badge ⚡ FAST -->
  <g transform="translate(340, 290)">
    <rect width="100" height="38" rx="10" fill="#0e1526" stroke="#06b6d4" stroke-width="1.5" opacity="0.95"/>
    <text x="12" y="24" fill="#06b6d4" font-family="sans-serif" font-size="13" font-weight="bold">⚡ 99+ SPEED</text>
  </g>
</svg>
